                  </tr>

        </div>
    <script>
            let chipscount=0;
        function chipsPlus(){
               chipscount+=1;
               document.getElementById("chips").innerHTML= `<h4>${chipscount}</h4>`
        }
            let sodacount=0;
        function sodaPlus(){
               sodacount+=1;

        }
            let cokicount=0;

               cokicount+=1;

        }
