<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="password">
    <button onclick="clickme()" id="btn">show password</button>
    <script>
            function clickme(){
                let inputRef=document.querySelector("input")
                let btn1=document.getElementById("btn")
                if(inputRef.type==="password"){
                     inputRef.type="text"
                     btn1.innerText="hide password"
                }
                else {
                     inputRef.type="password"
                     btn1.innerText="show password"
                } 
            }
    </script>
</body>
</html>
